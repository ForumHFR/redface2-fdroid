name: Publish APK to F-Droid repo

# Listens for a `repository_dispatch` event of type `rf2_release` fired by the
# `redface2` release workflow when a new release/dev build is produced. The payload
# carries the release tag, the APK asset filename, and (since #233) the channel +
# package_name so we can publish coexisting F-Droid packages (.beta / .dev / base)
# from a single repo. We download the matching APK from the redface2 GitHub Release
# (tag + filename) without API discovery; fdroidserver reads the package from the APK.
on:
  repository_dispatch:
    types: [rf2_release]
  # Manual trigger to allow a one-shot republish without re-firing redface2's CD.
  workflow_dispatch:
    inputs:
      tag:
        description: 'redface2 release tag (e.g. app-v72 or app-dev-v123)'
        required: true
      apk_filename:
        description: 'APK asset filename in the release'
        required: true
      package_name:
        description: 'applicationId (fr.forumhfr.redface2[.beta|.dev])'
        required: false
        default: 'fr.forumhfr.redface2'
      channel:
        description: 'beta | dev | release'
        required: false
        default: 'release'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to push to gh-pages
    steps:
      - name: Resolve inputs
        id: inputs
        shell: bash
        # Payload/inputs through env, NEVER interpolated into the script body, then validated against
        # strict charsets BEFORE reaching $GITHUB_OUTPUT (a newline/metachar could inject extra output
        # lines or shell commands downstream). package_name/channel default to the base/release values
        # so a pre-#233 dispatch still works.
        env:
          EVENT_NAME: ${{ github.event_name }}
          CP_TAG: ${{ github.event.client_payload.tag }}
          CP_APK: ${{ github.event.client_payload.apk_filename }}
          CP_PKG: ${{ github.event.client_payload.package_name }}
          CP_CHANNEL: ${{ github.event.client_payload.channel }}
          IN_TAG: ${{ github.event.inputs.tag }}
          IN_APK: ${{ github.event.inputs.apk_filename }}
          IN_PKG: ${{ github.event.inputs.package_name }}
          IN_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            tag="$CP_TAG"; apk="$CP_APK"; pkg="${CP_PKG:-fr.forumhfr.redface2}"; channel="${CP_CHANNEL:-release}"
          else
            tag="$IN_TAG"; apk="$IN_APK"; pkg="${IN_PKG:-fr.forumhfr.redface2}"; channel="${IN_CHANNEL:-release}"
          fi
          [[ "$tag"     =~ ^app(-dev)?-v[A-Za-z0-9._-]+$ ]] || { echo "::error::Bad tag '$tag'"; exit 1; }
          [[ "$apk"     =~ ^[A-Za-z0-9._-]+\.apk$ ]]        || { echo "::error::Bad apk_filename '$apk'"; exit 1; }
          [[ "$pkg"     =~ ^fr\.forumhfr\.redface2(\.beta|\.dev)?$ ]] || { echo "::error::Bad package_name '$pkg'"; exit 1; }
          [[ "$channel" =~ ^(beta|dev|release)$ ]]          || { echo "::error::Bad channel '$channel'"; exit 1; }
          {
            echo "tag=$tag"
            echo "apk_filename=$apk"
            echo "package_name=$pkg"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=F-Droid publish::tag=$tag pkg=$pkg channel=$channel apk=$apk"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install fdroidserver from PyPI
        # `apt install fdroidserver` on Ubuntu 24.04 ships 2.2.1 which bundles an
        # old androguard that chokes on APKs built with AGP 9.x
        # (`ResParserError: res1 must be zero!`). PyPI's fdroidserver 2.4.x
        # carries a patched androguard that handles modern resources.arsc.
        run: |
          sudo apt-get update -qq
          # System Java + apksigner are still needed (fdroidserver shells out
          # to jarsigner/apksigner) ; we just upgrade the Python package itself.
          sudo apt-get install -y --no-install-recommends \
            default-jdk-headless apksigner
          # Use a venv to avoid PEP 668 ; symlink fdroid into PATH for convenience.
          python3 -m venv /opt/fdroid-venv
          /opt/fdroid-venv/bin/pip install --quiet --upgrade pip
          /opt/fdroid-venv/bin/pip install --quiet fdroidserver
          sudo ln -s /opt/fdroid-venv/bin/fdroid /usr/local/bin/fdroid
          fdroid --version | head -1

      - name: Restore F-Droid keystore
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > fdroid.keystore
          chmod 600 fdroid.keystore

      - name: Write CI-only config.yml
        env:
          KEY_ALIAS_VALUE: ${{ secrets.FDROID_KEY_ALIAS }}
          KEYSTOREPASS_VALUE: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          # Same rationale as in bootstrap.yml : config.yml carries the
          # signing creds inline (F-Droid upstream convention), it lives only
          # on the ephemeral runner, and the push step is restricted to
          # `repo/` so config.yml never lands in any commit.
          umask 077
          cat > config.yml <<YAML
          repo_url: https://forumhfr.github.io/redface2-fdroid/repo
          repo_name: Redface 2 F-Droid repository
          repo_description: |-
            Dépôt F-Droid pour Redface 2, le client Android moderne de
            forum.hardware.fr. APKs signés avec la clé upload d'origine ;
            mises à jour publiées automatiquement à chaque release upstream.
          archive_older: 5
          archive_url: https://forumhfr.github.io/redface2-fdroid/archive
          archive_name: Redface 2 archive
          archive_description: Anciennes versions de Redface 2.
          keystore: fdroid.keystore
          repo_keyalias: ${KEY_ALIAS_VALUE}
          keystorepass: ${KEYSTOREPASS_VALUE}
          keypass: ${KEYSTOREPASS_VALUE}
          YAML
          chmod 600 config.yml

      - name: Download APK from redface2 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.inputs.outputs.tag }}
          APK: ${{ steps.inputs.outputs.apk_filename }}
        run: |
          mkdir -p repo
          # `--clobber` makes the step idempotent on re-runs : if a previous
          # job left an APK with the same name, we overwrite it. Bytes are
          # identical (same release asset, byte-pinned by tag) so this is
          # not destructive.
          gh release download "$TAG" \
            --repo ForumHFR/redface2 \
            --pattern "$APK" \
            --dir repo/ \
            --clobber

      - name: Seed categories.txt if empty
        # fdroidserver 2.4+ refuses to run if `repo/categories.txt` is
        # zero-size — even though it's supposed to regenerate the file
        # from app metadata. Bootstrap created it empty, so we pre-seed it
        # with the canonical category for Redface 2 to break the chicken-
        # and-egg. Subsequent fdroid update calls overwrite it with the
        # correct content derived from metadata YAML files.
        run: |
          if [[ ! -s repo/categories.txt ]]; then
            mkdir -p repo
            echo "Internet" > repo/categories.txt
          fi

      - name: Scrub phantom skeleton metadata (legacy)
        # Old runs with `--create-metadata` left `metadata/<64-hex>.yml`
        # skeletons on gh-pages. Without removing them BEFORE the new
        # fdroid update, they get re-read and the phantom package
        # resurfaces in the new index. Run this scrub before the metadata
        # creation step so the canonical metadata is the only one fdroid
        # update sees.
        run: |
          find metadata -maxdepth 1 -type f -name '????????????????????????????????????????????????????????????????.yml' \
            -print -delete || true

      - name: Ensure app metadata exists
        # fdroidserver 2.4+ refuses to generate the index if `repo/categories.txt` is zero-size (or if
        # no app declares a category). One metadata file PER package_name (since #233 we host coexisting
        # .beta / .dev / base packages), with a channel-specific Name so the F-Droid client shows
        # "Redface 2 β" / "Redface 2 dev" / "Redface 2". Idempotent: written once per package (the
        # `[[ -f ]]` gate preserves manual edits and prior runs).
        env:
          PACKAGE_NAME: ${{ steps.inputs.outputs.package_name }}
          CHANNEL: ${{ steps.inputs.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          case "$CHANNEL" in
            beta) NAME="Redface 2 β";   NOTE=" Version bêta (pré-1.0) : susceptible de contenir des bugs.";;
            dev)  NAME="Redface 2 dev"; NOTE=" Canal dev : builds bleeding-edge, instables.";;
            *)    NAME="Redface 2";     NOTE="";;
          esac
          meta="metadata/${PACKAGE_NAME}.yml"
          if [[ ! -f "$meta" ]]; then
            cat > "$meta" <<YAML
          Categories:
            - Internet
          License: GPL-3.0-only
          AuthorName: ForumHFR
          WebSite: https://github.com/ForumHFR/redface2
          SourceCode: https://github.com/ForumHFR/redface2
          IssueTracker: https://github.com/ForumHFR/redface2/issues
          Changelog: https://github.com/ForumHFR/redface2/blob/main/app/CHANGELOG.md
          Name: ${NAME}
          Summary: Client Android moderne du forum hardware.fr
          Description: |-
              Redface 2 est un client Android natif pour forum.hardware.fr,
              écrit en Kotlin avec Jetpack Compose. Lecture des topics,
              écriture (reply, quote, édition), recherche, drapeaux.
              Conçu pour remplacer l'app Redface historique sans dépendance
              Firebase ni Play Services.${NOTE}
          YAML
          fi

      - name: Pre-update workdir snapshot
        run: |
          echo "=== metadata/ ==="
          ls -la metadata/ 2>/dev/null || echo "(no metadata dir)"
          echo "=== repo/ ==="
          ls -la repo/ | head -15
          echo "=== config.yml head ==="
          head -10 config.yml

      - name: Run fdroid update
        # NOTE on dropped flags :
        # - `--delete-unknown` : removes APKs whose package is not tracked in
        #   any metadata. In our incremental flow, the metadata file is
        #   written one step earlier in the same job — if fdroidserver's
        #   scan-then-delete order races, the just-downloaded APK gets
        #   purged. Safer to skip.
        # - `--create-metadata` : generates skeleton metadata for any APK
        #   without a matching metadata file. Even when an explicit metadata
        #   file matches (our case), it ALSO creates a skeleton keyed by the
        #   APK's SHA256 hash, producing a "phantom" package in the index
        #   pointing at `/categories.txt`. We pre-create the canonical
        #   metadata file, so this flag is never needed.
        shell: bash
        run: |
          set -euo pipefail
          fdroid update --pretty

      - name: Post-update workdir snapshot
        if: always()
        run: |
          echo "=== metadata/ ==="
          ls -la metadata/ 2>/dev/null || echo "(no metadata dir)"
          echo "=== repo/ ==="
          ls -la repo/ | head -20

      - name: Clean keystore from runner
        if: always()
        run: |
          # Defensive — the runner is ephemeral but we don't want the keystore
          # surviving a step failure on a re-used runner image.
          shred -uvz fdroid.keystore || rm -f fdroid.keystore

      - name: Commit and push gh-pages
        run: |
          set -euo pipefail
          git config user.email "fdroid-bot@users.noreply.github.com"
          git config user.name "redface2-fdroid-publisher"
          echo "=== git status BEFORE add ==="
          git status -s
          echo "=== git ls-files repo/ (HEAD tracked) ==="
          git ls-files repo/ | head -10
          # Force-add repo/ (and metadata/, in case we want it tracked later).
          # `2>/dev/null || true` was masking failures — drop it.
          git add -A repo/
          git add -A metadata/ 2>/dev/null || true
          echo "=== git status AFTER add ==="
          git status -s | head -15
          echo "=== diff --cached --stat ==="
          git diff --cached --stat | tail -5
          if git diff --cached --quiet; then
            echo "No changes to commit — index unchanged."
          else
            git commit -m "fdroid: publish ${{ steps.inputs.outputs.tag }}"
            git push origin gh-pages
            echo "Pushed gh-pages."
          fi
